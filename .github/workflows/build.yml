# .github/workflows/build.yml
name: Build Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numer wersji (np. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          
      - name: Get tag version
        id: get_version
        shell: pwsh
        run: |
          # Extract the version number without the 'v' prefix
          $tag = "${{ github.event.inputs.version }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          
      - name: Build with dotnet publish
        run: |
          cd WhipCast
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          Move-Item "bin\Release\net9.0-windows\win-x64\publish\WhipCast.exe" "..\WhipCast-${{ steps.get_version.outputs.VERSION }}-Windows-x64.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            WhipCast-${{ steps.get_version.outputs.VERSION }}-Windows-x64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: 1
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print Build Environment
        run: |
          python -VV
          pyinstaller --version
          uname -a
          
      - name: Get tag version
        id: get_version
        run: |
          TAG="${{ github.event.inputs.version }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "WhipCast-${{ steps.get_version.outputs.VERSION }}-Linux-x86_64" \
            --exclude-module "tkinter" \
            --exclude-module "unittest" \
            --exclude-module "pydoc" \
            --exclude-module "xml" \
            embed_linux.py

      - name: Print Linux Artifact Size
        run: |
          ls -lh "dist/WhipCast-${{ steps.get_version.outputs.VERSION }}-Linux-x86_64"
          stat --printf='%n %s bytes\n' "dist/WhipCast-${{ steps.get_version.outputs.VERSION }}-Linux-x86_64"

      - name: Upload Linux Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/WhipCast-${{ steps.get_version.outputs.VERSION }}-Linux-x86_64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}